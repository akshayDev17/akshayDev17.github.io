<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Atlas of India</title>
<meta name="description" content="All 543 Lok Sabha constituencies, each shaded by the party that won it, with state borders drawn over them. Hover a state for its party-wise result. 2014, 2019 and 2024.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F8; --paper-2:#E3E9F4; --ink:#0F1220; --muted:#525A6B;
  --rule:#D3D9E6; --rule-2:#BCC4D6;
  --serif:"Newsreader",ui-serif,Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* No accent colour on this page. Every hue here belongs to a party: an accent
     would compete with the palette that carries the data. The one non-party
     colour is --ink, used for the state outlines and the card's structure. */

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:3px; --r2:6px;
  --col:86rem;
  --pad:max(clamp(1.25rem,4vw,4.5rem),calc((100vw - var(--col)) / 2));
  --ease:cubic-bezier(.2,0,0,1);

  /* The one dial. 1 = the map fits the screen exactly and never scrolls.
     Raise it to trade vertical scroll for width: India is taller than wide, so
     at 1 a laptop gives the map about half the screen width. */
  --map-spill:1;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-optical-sizing:auto;
  font-size:1.0625rem;line-height:1.65;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  /* One screen, and the browser does the arithmetic. There is no hand-tuned
     chrome constant left to drift out of step with the masthead: main takes the
     whole viewport, the masthead takes what it needs, and the map takes exactly
     the remainder. */
  display:flex;flex-direction:column;
  min-height:100dvh;
}
p{margin:0}
.lbl{
  font-family:var(--mono);font-size:.625rem;line-height:1.4;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
}

/* ── shell ────────────────────────────────────────────────────────────── */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 var(--pad)}
.hair{height:1px;background:var(--rule);border:0;margin:0}

/* ── masthead ─────────────────────────────────────────────────────────── */
.masthead{flex:0 0 auto;padding-top:clamp(1rem,2.4vw,2rem)}
.mh-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s5);flex-wrap:wrap}
.mh-top .lbl{margin:0}
.years{display:flex;align-items:baseline;gap:2px;margin-bottom:-6px}
.year{
  appearance:none;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:.8125rem;letter-spacing:.06em;color:var(--muted);
  padding:6px 10px 8px;border-bottom:2px solid transparent;
  transition:color .18s var(--ease),border-color .18s var(--ease);
}
.year:hover{color:var(--ink)}
.year[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.year:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
.year[disabled]{opacity:.4;cursor:default}

/* ── the plate ────────────────────────────────────────────────────────── */
.field{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:clamp(.5rem,1.5vw,1rem) 0 clamp(.75rem,1.2vw,1.25rem)}
.mapfig{
  flex:1 1 auto;min-height:0;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s3);
}
#map{
  display:block;margin:0 auto;overflow:visible;
  /* India's projected extent is 0.8839 wide to 1 tall — taller than wide, which
     is the whole problem. A map wide enough to fill a 1440px viewport is 1629px
     tall; one that fits a 900px viewport is 795px wide. Width and height cannot
     both be filled, so height is the binding constraint and width is derived:
     whatever height the viewport can spare, times the ratio, capped by the
     column so it can never spill sideways either.
     0.8839 = geoMercator extent of lon 68.09..97.40 by lat 6.76..37.04. */
  aspect-ratio:884 / 1000;
  /* Height is the constraint, so it is the one that is set; width follows from
     India's ratio. max-width catches the narrow screen where the derived width
     would exceed the column — there the map is width-bound instead, and because
     the svg letterboxes its own drawing, the map simply centres in the space
     rather than distorting. */
  height:calc(100% * var(--map-spill));
  width:auto;
  max-width:100%;
}

/* Constituency fill. No stroke: a boundary is only visible where two adjacent
   seats were won by different parties, which is the whole point of shading at
   this granularity. */
#map .pc{fill:var(--c);stroke:none;transition:fill .22s var(--ease)}

/* The only line the map draws. fill:none plus pointer-events:all makes the whole
   area of a state hoverable while drawing nothing inside it. */
#map .st{
  fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;
  pointer-events:all;cursor:pointer;
  transition:stroke-width .16s var(--ease);
}
#map .st:hover,#map .st.is-active{stroke-width:2.4}
#map .st:focus-visible{outline:none;stroke-width:3.2}

/* State codes are the map's second channel. Colour alone cannot separate twenty
   parties, so where two neighbouring fills sit close together the text is what
   tells the reader which state they are looking at. */
#map text{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  fill:var(--ink);paint-order:stroke fill;stroke:var(--paper);stroke-width:3px;
  stroke-linejoin:round;pointer-events:none;text-anchor:middle;
}

/* The note is a status line, not a caption: it holds the message when a year has
   no result file, and takes no space at all the rest of the time. */
.mapnote{flex:0 0 auto;text-align:center}
.mapnote:empty{display:none}

/* ── the hover card ───────────────────────────────────────────────────── */
#card{
  position:fixed;z-index:9;min-width:19rem;max-width:24rem;
  background:#fff;border:1px solid var(--rule-2);border-radius:var(--r2);
  box-shadow:0 6px 26px rgba(15,18,32,.14);
  padding:14px 16px 12px;
  opacity:0;pointer-events:none;
  transition:opacity .14s var(--ease);
}
#card.on{opacity:1}
#card .sub{font-family:var(--mono);font-size:.625rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 2px}
#card h2{margin:0;font-size:1.125rem;font-weight:400;line-height:1.2;letter-spacing:-.01em}
#card .meta{font-family:var(--mono);font-size:.6875rem;color:var(--muted);margin:4px 0 10px}
#card table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.6875rem}
#card th{
  font-weight:400;font-size:.5625rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:0 0 5px;border-bottom:1px solid var(--rule-2);
}
#card td{padding:4px 0;text-align:right;border-top:1px solid var(--rule)}
#card tr:first-child td{border-top:0}
/* The label column is the only one that is not a number, so it is the only one
   that is left-aligned. Everything else right-aligns so digits line up on the
   ones place — mixing the two made the party labels and the seat counts meet at
   the same cell edge with no gap at all. */
#card th:first-child,#card td:first-child{text-align:left}
/* a gutter, so two columns cannot touch however narrow the card gets */
#card th+th,#card td+td{padding-left:16px}
#card td.p{display:flex;align-items:center;gap:7px}
#card .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto;background:var(--c);
  box-shadow:inset 0 0 0 1px rgba(15,18,32,.2)}
#card .more{color:var(--muted)}


/* ── responsive ───────────────────────────────────────────────────────── */
@media (max-width:44rem){
  /* Below a 400px-wide map the label pass drops every label anyway, so this
     states an intent the geometry already enforces. */
  #map text{display:none}
  #card{min-width:0;max-width:calc(100vw - 20px)}
}
@media (prefers-reduced-motion:reduce){
  #map .pc,#map .st,.year,#card{transition:none}
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="mh-top">
      <p class="lbl">Election Atlas of India</p>
      <div class="years" id="years" role="group" aria-label="General election year"></div>
    </div>
    <hr class="hair" style="margin-top:var(--s4)">
  </header>

  <section class="field">
    <figure class="mapfig">
      <svg id="map" viewBox="0 0 884 1000" preserveAspectRatio="xMidYMid meet"
           role="group" aria-label="Map of India. Each of the 543 parliamentary constituencies is filled with the colour of the party that won it; the borders drawn over them are state and union territory boundaries."></svg>
      <p class="lbl mapnote" id="mapnote" role="status"></p>
    </figure>
  </section>
</main>


<div id="card" role="status" aria-live="polite"></div>

<script type="module">
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };
const nf = n => Math.round(n).toLocaleString('en-IN');
const pc1 = n => (n * 100).toFixed(1) + '%';

let geo, topojson;
try {
  [geo, topojson] = await Promise.all([
    import('./vendor/d3-geo.js'),
    import('./vendor/topojson-client.js'),
  ]);
} catch (err) {
  $('#mapnote').textContent = 'The map library could not be loaded, so the atlas cannot draw.';
  throw err;
}

const mapEl = $('#map'), noteEl = $('#mapnote'), yearsEl = $('#years'), card = $('#card');

/* ── fixed vocabularies and geometry ──────────────────────────────────── */
const [manifest, regionsDoc, partiesDoc, statesTopo, pcsTopo] = await Promise.all([
  fetch('data/manifest.json').then(r => r.json()),
  fetch('data/regions.json').then(r => r.json()),
  fetch('data/parties.json').then(r => r.json()),
  fetch('data/geo/india-states.json').then(r => r.json()),
  fetch('data/geo/india-pcs.json').then(r => r.json()),
]);

const regionByCode = new Map(regionsDoc.regions.map(r => [r.code, r]));
const regionBySource = new Map();
for (const r of regionsDoc.regions) for (const s of r.sourceNames) regionBySource.set(s, r.code);

const partyByCode = new Map(partiesDoc.parties.map(p => [p.code, p]));
const fallback = partiesDoc.fallback;
const colour = c => (partyByCode.get(c) || fallback).colour;
const partyName = c => (partyByCode.get(c) || fallback).name;

const level = manifest.levels.find(l => l.id === 'state');
const pcLevel = manifest.levels.find(l => l.id === 'parliamentary');

const states = topojson.feature(statesTopo, statesTopo.objects[level.topologyObject]);
const pcs = topojson.feature(pcsTopo, pcsTopo.objects[pcLevel.topologyObject]);

/* ── the constituency files carry counts; everything shown is derived ─── */
function aggregate(year) {
  const byRegion = new Map();
  let totalVotes = 0;
  for (const c of Object.values(year.constituencies)) {
    let m = byRegion.get(c.st);
    if (!m) byRegion.set(c.st, m = new Map());
    const w = m.get(c.p) || { seats: 0, votes: 0 };
    w.seats++; w.votes += c.v; totalVotes += c.v;
    m.set(c.p, w);
    // parties that polled in the constituency but won nothing still count votes
    for (const [code, v] of Object.entries(c.o || {})) {
      const o = m.get(code) || { seats: 0, votes: 0 };
      o.votes += v; totalVotes += v; m.set(code, o);
    }
  }
  return { byRegion, totalVotes };
}

/* ── draw ─────────────────────────────────────────────────────────────── */
const pcPaths = new Map();      // unique_id -> path
const statePaths = new Map();   // region code -> path
let projection, pathGen;

function drawMap() {
  const box = mapEl.getBoundingClientRect();
  const W = Math.max(320, Math.round(box.width));
  const H = Math.max(260, Math.round(box.height));
  mapEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  projection = geo.geoMercator().fitExtent([[2, 2], [W - 2, H - 2]], states);
  pathGen = geo.geoPath(projection);
  mapEl.textContent = '';
  pcPaths.clear(); statePaths.clear();

  const gPC = document.createElementNS(NS, 'g');
  for (const f of pcs.features) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', pathGen(f));
    p.setAttribute('class', 'pc');
    p.dataset.uid = f.properties.unique_id;
    gPC.appendChild(p);
    pcPaths.set(f.properties.unique_id, p);
  }
  mapEl.appendChild(gPC);

  const gST = document.createElementNS(NS, 'g');
  for (const f of states.features) {
    const code = regionBySource.get(f.properties[level.geometryKey]);
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', pathGen(f));
    p.setAttribute('class', 'st');
    if (code) {
      p.dataset.region = code;
      p.setAttribute('tabindex', '0');
      p.setAttribute('role', 'button');
      statePaths.set(code, p);
    }
    gST.appendChild(p);
  }
  mapEl.appendChild(gST);

  applyYear();
  drawLabels();
}

/* Labels select on the size of the shape, not on seats returned: selecting on
   seats hid Ladakh, which is one seat and the largest shape on the map. */
function drawLabels() {
  mapEl.querySelectorAll('text').forEach(t => t.remove());
  if (!currentYear) return;
  const W = +mapEl.getAttribute('viewBox').split(' ')[2];
  if (W < 400) return;

  const candidates = [];
  for (const f of states.features) {
    const code = regionBySource.get(f.properties[level.geometryKey]);
    if (!code || !statePaths.has(code)) continue;
    const [[bx0, by0], [bx1, by1]] = pathGen.bounds(f);
    if (bx1 - bx0 < 26 || by1 - by0 < 13) continue;
    // geoCentroid and geoContains both take [longitude, latitude]; geoPath's own
    // centroid returns projected pixels, and mixing the two silently drops every
    // candidate. Work in geographic space and project at the end.
    const c = geo.geoCentroid(f);
    if (!isFinite(c[0]) || !isFinite(c[1])) continue;
    const bd = geo.geoBounds(f);
    const mid = [(bd[0][0] + bd[1][0]) / 2, (bd[0][1] + bd[1][1]) / 2];
    let at = null;
    for (const pt of [c, [(c[0] + mid[0]) / 2, (c[1] + mid[1]) / 2], mid,
                      [(c[0] * 2 + mid[0]) / 3, (c[1] * 2 + mid[1]) / 3]]) {
      if (isFinite(pt[0]) && isFinite(pt[1]) && geo.geoContains(f, pt)) { at = pt; break; }
    }
    if (!at) continue;
    const xy = projection(at);
    if (!isFinite(xy[0]) || !isFinite(xy[1])) continue;
    candidates.push({ code, at: xy, area: (bx1 - bx0) * (by1 - by0) });
  }

  // Largest shapes place first, so when two labels collide the reader keeps the
  // one they are more likely to be looking for.
  candidates.sort((a, b) => b.area - a.area);
  const placed = [];
  for (const c of candidates) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', c.at[0].toFixed(1));
    t.setAttribute('y', c.at[1].toFixed(1));
    t.textContent = c.code.slice(3);        // IN-UP -> UP, the standard postal code
    t.dataset.region = c.code;
    mapEl.appendChild(t);
    const box = t.getBoundingClientRect();
    const hits = placed.some(p => box.left < p.right && p.left < box.right &&
                                  box.top < p.bottom && p.top < box.bottom);
    if (!box.width || hits) t.remove(); else placed.push(box);
  }
}

/* ── colour from the loaded year ──────────────────────────────────────── */
function applyYear() {
  if (!currentYear) return;
  for (const [uid, p] of pcPaths) {
    const c = currentYear.constituencies[uid];
    p.style.setProperty('--c', c ? colour(c.p) : 'var(--paper-2)');
  }
  for (const [code, p] of statePaths) {
    const m = agg.byRegion.get(code);
    const lead = m ? [...m.entries()].sort((a, b) => b[1].seats - a[1].seats)[0] : null;
    p.setAttribute('aria-label', lead
      ? `${regionByCode.get(code).name}. ${lead[0]} won ${lead[1].seats} constituencies.`
      : `${regionByCode.get(code).name}. No result for this year.`);
  }
}

/* ── the card ─────────────────────────────────────────────────────────── */
const MAX_ROWS = 7;
function fillCard(code) {
  const rows = [...(agg.byRegion.get(code) || new Map())]
    .map(([p, v]) => ({ code: p, seats: v.seats, votes: v.votes }))
    .filter(r => r.seats > 0 || r.votes > 0)
    .sort((a, b) => b.seats - a.seats || b.votes - a.votes);
  if (!rows.length) return false;

  const totalVotes = rows.reduce((n, r) => n + r.votes, 0);
  const totalSeats = rows.reduce((n, r) => n + r.seats, 0);
  const region = regionByCode.get(code);
  const rest = rows.slice(MAX_ROWS);
  const restVotes = rest.reduce((n, r) => n + r.votes, 0);

  card.innerHTML =
    `<p class="sub">${region.type === 'ut' ? 'Union territory' : 'State'}</p>
     <h2>${region.name}</h2>
     <p class="meta">${totalSeats} constituencies · ${nf(totalVotes)} votes polled</p>
     <table><thead><tr><th>Party</th><th>Seats won</th><th>Votes</th><th>Share</th></tr></thead><tbody>` +
    rows.slice(0, MAX_ROWS).map(r =>
      `<tr><td class="p"><i class="sw" style="--c:${colour(r.code)}"></i>${r.code}</td>` +
      `<td>${r.seats}</td><td>${nf(r.votes)}</td><td>${pc1(totalVotes ? r.votes / totalVotes : 0)}</td></tr>`).join('') +
    (rest.length ? `<tr class="more"><td class="p">+${rest.length} more</td>` +
      `<td>${rest.reduce((n, r) => n + r.seats, 0)}</td><td>${nf(restVotes)}</td>` +
      `<td>${pc1(totalVotes ? restVotes / totalVotes : 0)}</td></tr>` : '') +
    `</tbody></table>`;
  card.title = `${rows[0].code} leads ${region.name} — ${partyName(rows[0].code)}`;
  return true;
}

function placeCard(x, y) {
  card.classList.add('on');
  const r = card.getBoundingClientRect();
  card.style.left = Math.max(8, Math.min(x + 18, innerWidth - r.width - 12)) + 'px';
  card.style.top = Math.max(8, Math.min(y + 14, innerHeight - r.height - 12)) + 'px';
}
function showCard(code, x, y) { if (fillCard(code)) placeCard(x, y); }
function hideCard() {
  card.classList.remove('on');
  for (const p of statePaths.values()) p.classList.remove('is-active');
}

/* Delegated, so a redraw on resize cannot strand the handlers on detached paths. */
function bindEvents() {
  const codeOf = e => {
    const p = e.target.closest && e.target.closest('path.st[data-region]');
    return p && p.dataset.region;
  };
  mapEl.addEventListener('pointerover', e => {
    const c = codeOf(e); if (!c) return;
    statePaths.get(c).classList.add('is-active');
    showCard(c, e.clientX, e.clientY);
  });
  mapEl.addEventListener('pointermove', e => {
    const c = codeOf(e); if (!c || !card.classList.contains('on')) return;
    placeCard(e.clientX, e.clientY);
  });
  mapEl.addEventListener('pointerout', e => { if (codeOf(e)) hideCard(); });
  mapEl.addEventListener('focusin', e => {
    const c = codeOf(e); if (!c) return;
    statePaths.get(c).classList.add('is-active');
    const r = e.target.getBoundingClientRect();
    showCard(c, r.left + r.width / 2, r.top + r.height / 2);
  });
  mapEl.addEventListener('focusout', hideCard);
  mapEl.addEventListener('click', e => { const c = codeOf(e); if (c) showCard(c, e.clientX, e.clientY); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });
}

/* ── years ────────────────────────────────────────────────────────────── */
let currentYear = null, agg = null;
const yearCache = new Map();
async function loadYear(y) {
  /* manifest paths are relative to the data directory, not to the page */
  const url = 'data/' + pcLevel.results.replace('{year}', y);
  if (!yearCache.has(y)) yearCache.set(y, fetch(url).then(r => {
    if (!r.ok) throw new Error(`${y} is not published`);
    return r.json();
  }));
  return yearCache.get(y);
}

async function selectYear(y) {
  for (const b of yearsEl.children) { b.setAttribute('aria-pressed', String(+b.dataset.year === y)); b.disabled = true; }
  hideCard();
  try {
    currentYear = await loadYear(y);
    agg = aggregate(currentYear);
    noteEl.textContent = '';
    applyYear();
    drawLabels();
  } catch (err) {
    currentYear = null; agg = null;
    noteEl.textContent = `${y} has no constituency result file yet.`;
    for (const p of pcPaths.values()) p.style.setProperty('--c', 'var(--paper-2)');
    for (const p of statePaths.values()) p.removeAttribute('aria-label');
  } finally {
    for (const b of yearsEl.children) b.disabled = false;
  }
}

/* ── boot ─────────────────────────────────────────────────────────────── */
yearsEl.textContent = '';
for (const y of manifest.elections.ls.years) {
  const b = el('button', 'year');
  b.type = 'button'; b.dataset.year = y; b.textContent = y;
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => selectYear(y));
  yearsEl.appendChild(b);
}

drawMap();
bindEvents();
let rt;
new ResizeObserver(() => {
  clearTimeout(rt);
  rt = setTimeout(() => { drawMap(); }, 60);
}).observe(mapEl);

await selectYear(manifest.elections.ls.years[manifest.elections.ls.years.length - 1]);
</script>
</body>
</html>

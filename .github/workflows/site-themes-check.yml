# Fails when the theme copies in this repo drift from the pinned site-themes
# tag: the boot script inlined in each page's <head>, the stylesheet and picker
# links, and the files under assets/site-themes/<tag>/.
name: site-themes check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run themes:check
